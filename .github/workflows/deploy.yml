name: Deploy to Bloxity

# Builds the frontend and uploads it to Bloxity Hosting (https://hosting.bloxity.io/docs).
# main -> prod channel (https://<gameId>.play.bloxity.io), dev -> dev channel.
# The game id is the slug (GAME_SLUG in src/config.js), used as the folder/game name on Bloxity.
# Needs LEGION_DEPLOY_TOKEN (secret). LEGION_GAME_ID (variable or secret) optionally overrides the slug.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  GAME_SLUG: run-a-farm

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy config
        run: |
          if ! grep -q "GAME_SLUG = '${GAME_SLUG}'" src/config.js; then
            echo "::error::GAME_SLUG in src/config.js is not '${GAME_SLUG}'."
            exit 1
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
        env:
          DEPLOY_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}

      - name: Build
        # VITE_DEV_MODE is deliberately unset so deployed builds use the real Bloxity SDK/CDN.
        # No server URL: built games always reach Run-a-farm-backend through the
        # Bloxity matchmaker (Legion.SDK.net.resolveEndpoint in src/bloxity.js).
        # GameAnalytics (src/analytics.js) only for prod, so dev-channel tests don't mix into the
        # real numbers; without the GA_GAME_KEY / GA_SECRET_KEY secrets analytics stays off.
        run: |
          export VITE_BUILD_ID="${{ steps.channel.outputs.channel }}-${GITHUB_SHA::7}"
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            VITE_GA_GAME_KEY="${GA_GAME_KEY}" VITE_GA_SECRET_KEY="${GA_SECRET_KEY}" npm run build
          else
            npm run build:dev
          fi
        env:
          GA_GAME_KEY: ${{ secrets.GA_GAME_KEY }}
          GA_SECRET_KEY: ${{ secrets.GA_SECRET_KEY }}

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - name: Upload to Bloxity
        run: |
          curl -sS -f -X POST \
            "https://api.bloxity.io/v1/hosting/games/${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID || env.GAME_SLUG }}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${{ secrets.LEGION_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
